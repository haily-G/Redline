<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>레드라인</title>
<style>
:root{
  --bg:#0b0b0d; --panel:#141416; --border:#3a1414; --red:#b3231c;
  --red-dim:#5c1a17; --text:#d9d4c6; --dim:#8a8478; --coin:#c9a24a;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){:root{--bg:#0b0b0d;}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Nanum Myeongjo","Batang",Georgia,serif;
  line-height:1.7;
}
#app{max-width:640px;margin:0 auto;padding:32px 20px 60px;min-height:100vh}
h1{font-size:1.6rem;letter-spacing:2px;color:var(--red);margin:0 0 4px;font-weight:700}
h2{font-size:1.05rem;color:#e8e2d2;border-bottom:1px solid var(--border);padding-bottom:8px;margin:0 0 16px}
.sub{color:var(--dim);font-size:.85rem;margin-bottom:24px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:2px;padding:20px;margin-bottom:16px}
.narr{white-space:pre-line;font-size:1rem;margin-bottom:18px}
.glitch{color:var(--red);font-family:monospace;letter-spacing:1px;text-shadow:0 0 6px rgba(179,35,28,.7);word-break:break-all;font-size:.8rem;opacity:.85}
.rulewrap{font-size:.92rem;color:#c7c1b3}
.rulewrap li{margin-bottom:10px}
button{
  display:block;width:100%;text-align:left;background:#1b1b1e;color:var(--text);
  border:1px solid var(--border);padding:12px 14px;margin-bottom:10px;border-radius:2px;
  font-family:inherit;font-size:.95rem;cursor:pointer;transition:border-color .15s,background .15s;
}
button:hover{border-color:var(--red);background:#201414}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--red)}
.row{display:flex;gap:10px}
.row button{flex:1}
.statbar{display:flex;justify-content:space-between;font-family:monospace;font-size:.82rem;color:var(--dim);margin-bottom:6px}
.statgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}
.statgrid input{width:56px;background:#1b1b1e;color:var(--text);border:1px solid var(--border);text-align:center;padding:6px;font-family:monospace}
.hud{display:flex;justify-content:space-between;font-family:monospace;font-size:.78rem;color:var(--dim);border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:20px;flex-wrap:wrap;gap:6px}
.hud b{color:var(--text)}
.coin{color:var(--coin)}
.tag{display:inline-block;font-size:.72rem;color:var(--dim);border:1px solid var(--border);padding:1px 6px;border-radius:2px;margin-right:6px}
.roll{font-family:monospace;color:var(--red);font-weight:bold}
.row .slot{flex:1}
.redtxt{color:var(--red);font-weight:bold;text-shadow:0 0 6px rgba(179,35,28,.6)}
.art{margin-bottom:14px;border:1px solid var(--border);border-radius:2px;overflow:hidden;background:#000;line-height:0}
.art svg{display:block;width:100%;height:auto}
button small{color:var(--dim);font-size:.72rem}
.slot{border:1px dashed var(--border);padding:8px 10px;font-size:.82rem;color:var(--dim);border-radius:2px;line-height:1.5}
.slot.filled{border-style:solid;color:var(--text)}
.slot.filled span{color:var(--dim);font-size:.75rem}
.ok{color:#7fae7f}.bad{color:var(--red)}
</style>
</head>
<body>
<div id="app"></div>

const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=arr=>arr[rand(0,arr.length-1)];
const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};

const LV=k=>Math.floor((S.stats[k]+S.bonus[k])/2)+(k==='mind'?(S.mindMax||0):0);

const josa=(n,a,b)=>{const c=(n||'').charCodeAt((n||'').length-1);return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0)?a:b;};
function totalMind(){return Math.max(0, LV('mind') - (S._mindLoss||0));}

function contractCardHTML(mode){
  if(mode==='only8'){
    return `<div class="card rulewrap"><ol start="8"><li>이 다음 수칙은 무시하십시오.</li></ol></div>`;
  }
  if(mode==='secret'){
    const t=CONTRACT_LINES[1];
    return `<div class="card rulewrap"><ol>${Array(8).fill('<li>'+t+'</li>').join('')}</ol></div>`;
  }
  const corrupted=!!mode;
  const same='이 다음 수칙은 무시하십시오.';
  const li=n=>corrupted && n<=7 ? same : CONTRACT_LINES[n];
  return `<div class="card rulewrap">
      <ol>
        <li>${li(1)}</li>
        <li>${li(2)}</li>
        <li>${li(3)}</li>

  const keys=[['observe','관찰력','시각적 이상을 포착한다'],['hearing','듣기','소음을 통해 이상을 포착한다'],['mind','정신력','0이 되면 그 자리에서 기절, 게임 오버'],['instinct','직감','근거 없이 현실을 가늠한다']];
  const used=Object.values(S.stats).reduce((a,b)=>a+b,0);
  const left=S.points-used;
  app.appendChild(el(`
    <h2>${S.name}, 스탯을 배분하십시오</h2>
    <div class="sub">총 20포인트. 2포인트당 1레벨이 됩니다. 남은 포인트: <b style="color:${left===0?'#7fae7f':'var(--red)'}">${left}</b></div>
    <div class="card" id="statCard"></div>
    <button id="okBtn" ${left!==0?'disabled':''}>배분 완료</button>
  `));
  const card=$('statCard');
  keys.forEach(([k,label,desc])=>{
    const row=el(`
      <div class="statgrid">
        <div><b>${label}</b><div style="font-size:.78rem;color:var(--dim)">${desc}</div></div>
        <div style="display:flex;align-items:center;gap:6px">
          <button data-k="${k}" data-d="-1" style="width:32px;padding:6px;margin:0;text-align:center">－</button>
          <input readonly value="${S.stats[k]}" id="v_${k}">
          <button data-k="${k}" data-d="1" style="width:32px;padding:6px;margin:0;text-align:center">＋</button>
        </div>
        <div style="font-family:monospace;color:var(--dim);text-align:right">Lv.${Math.floor(S.stats[k]/2)}</div>
      </div>`);
    card.appendChild(row);
  });
  card.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{
      const k=b.dataset.k,d=+b.dataset.d;
      const used=Object.values(S.stats).reduce((a,x)=>a+x,0);
      if(d>0 && used>=S.points) return;
      if(d<0 && S.stats[k]<=0) return;
      S.stats[k]+=d;
      render();
    };
  });
  $('okBtn')&&($('okBtn').onclick=()=>{S.screen='contract';render();});
},

predecessor_event(){
  const step=S._predStep||0;
  let text, choices, onPick;
  if(step===0){
    text='이제는 제법 익숙해진 출근길. 이상현상이 아직 나타나지 않은 오후 11시.\n\n순찰실 앞에 누군가가 서 있다.\n\n희끗한 머리를 가진 중년 남성. 지금 입고 있는 순찰복의 옛 주인이다.';
    choices=['전임자에게 인사한다.'];
    onPick=()=>{ S._predStep=1; render(); };
  } else if(step===1){
    text='인사를 들은 그가 가볍게 고개를 끄덕인다.\n\n"그래, 몸 건강히 잘 지내는 것 같아서 다행이구만..."\n\n그는 뭔가 불편한지 주위를 두리번거리다 작게 속삭인다.\n\n"자네, 여기서 일한 지 이제 6일째 되어가고 있지? 내가 자네가 걱정 되어서 하는 말이니 잘 들어주게."';
    choices=['듣는다.','듣지 않는다.'];
    onPick=(i)=>{ S._predStep = i===0 ? 2 : 10; render(); };
  } else if(step===2){
    text='그의 표정이 잠시 안도하듯 환해진다.\n\n"그래, 잘 생각했어."\n\n그가 조금 더 가까이 다가와 말한다.\n\n"자네도 이쯤되면 알겠지. 여기서 하는 일이라는 게 그냥 빨간 줄 몇 개 긋는 게 아니란 걸."';
    choices=['계속 듣는다.'];
    onPick=()=>{ S._predStep=3; render(); };
  } else if(step===3){
    text='"순찰실 캐비닛 안쪽에 사직서가 있어. 원래 열흘 이상 근무한 사람한테만 그들이 알려주는 거지만..."\n\n그는 눈치를 보듯 다시 한 번 주위를 둘러본다.\n\n"거기에 자네 이름을 적어. 그리고 우체통에 부치면 다음 날에 퇴사가 되어 있을 거야."';
    choices=['알려줘서 고맙다고 말한다.'];
    onPick=()=>{ S._predStep=4; render(); };
  } else if(step===4){
    text='감사인사를 들은 그 자는 더 이상 말을 꺼내지 않고 빠르게 자리를 뜬다.';
    choices=['정비를 시작한다.'];
    onPick=()=>{ S.knowsResignation=true; S.screen='day_rules'; render(); };
  } else {
    text='거절당한 그는 조금 몸을 움찔거리듯 떤다.\n\n"그, 내가 위험을 무릅쓰고 알려주러 온 건데... 거 참, 버릇 없기는!"\n\n그는 버럭 화를 내고서는 자리를 뜬다.';
    choices=['정비를 시작한다.'];
    onPick=()=>{ S.knowsResignation=false; S.screen='day_rules'; render(); };
  }
  app.appendChild(el(`${hud()}<div class="card narr">${text}</div><div id="predChoices"></div>`));
  const box=$('predChoices');
  choices.forEach((label,i)=>{
    const b=document.createElement('button'); b.textContent=label;
    b.onclick=()=>onPick(i);
    box.appendChild(b);
  });
},

shop(){
  const full=S.items.length>=S.slots;
  app.appendChild(el(`
    ${hud()}
    <h2>${S.day>=10?'김솔의 ':''}만물상</h2>
    ${S._kimSmile?'<div class="card narr">그가 의미심장한 미소를 지었다.</div>':''}
    <div class="sub">보유 주화: <span class="coin">${S.coins}</span> · 오늘은 하나만 살 수 있다.${full?` 장비 슬롯이 가득 차 있어, 장비를 사면 <b>${S.items[0].name}</b>을(를) 내려놓게 된다. (뽑기는 슬롯을 쓰지 않는다)`:''}</div>
    <div class="card" id="shopCard"></div>
    <button id="skipBtn">사지 않고 나선다</button>
  `));
  const c=$('shopCard');
  S._shopPool.forEach(it=>{
    const b=document.createElement('button');
    const price=shopPrice(it);
    const afford=S.coins>=price;
    b.disabled=!afford;
    b.innerHTML=`<b>${it.name}</b> <span class="coin">${price<it.cost?'<s style="color:var(--dim)">'+it.cost+'</s> ':''}${price}주화</span>${statPreview(it)}<span style="font-size:.85rem;color:var(--dim)">${it.desc}</span>`;
    b.onclick=()=>{
      S.coins-=price;
      if(it.consumable==='fortune'){
        if(S._fortuneDay!==S.day){
          const anomIdx=S._pendingHouses.map((h,i)=>h.isAnomaly?i+1:null).filter(v=>v!==null);
          S._fortuneN=pick(anomIdx); S._fortuneDay=S.day;
        }
        const n=S._fortuneN;
        S.fortuneHint=`뽑기를 펼치니 이런 문구가 적혀 있다 — "오늘 밤, ${n}번째로 마주칠 집을 각별히 조심하라."`;
      } else {
        if(S.items.length>=S.slots) removeItem(S.items[0]);
        addItem(it);
      }
      S._kimSmile=false; S.screen='day_intro'; render();
    };
    c.appendChild(b);
  });
  $('skipBtn').onclick=()=>{S._kimSmile=false; S.screen='day_intro';render();};
},

        <span style="font-family:'Segoe Script','Comic Sans MS',cursive;font-style:italic;font-size:1.15rem;color:#fff;letter-spacing:1px">11. 4.00. <svg width="34" height="30" viewBox="0 0 34 30" style="vertical-align:middle" xmlns="http://www.w3.org/2000/svg"><path d="M3 15 L17 3 L31 15 M7 13 V27 H27 V13 M14 27 V19 H20 V27" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg> &lt;-</span>
      </div>
      <div class="card narr">쪽지를 살펴본 사이에 검은 사람은 어디론가 가고 없었다.</div>
      <button id="blkNext">계속 순찰한다</button>
    `));
    $('blkNext').onclick=()=>{ S._blackDone=true; S.screen='patrol'; render(); };
  }
},

ne_gone(){
  const hh=String(S.hour+1).padStart(2,'0');
  app.appendChild(el(`
    ${hud()}
    <h2>${S.day}일차 순찰 · 현재 시각 ${hh}:00</h2>
    ${S.notice?`<div class="card" style="padding:10px 14px;font-size:.9rem">${S.notice}</div>`:''}
    <div class="card narr">어제 보았던 북동쪽 순찰실이 오늘은 보이지 않는다.</div>
    <button id="goneBtn">계속 순찰한다</button>
  `));
  $('goneBtn').onclick=()=>{ S._goneDone=true; S.notice=''; S.screen='patrol'; render(); };
},

door_event(){
  const d0=S._door, rem=maxChecks()-d0.checks;
  const hh=String(S.hour+1).padStart(2,'0');
  const choose=d0.phase==='choose';
  app.appendChild(el(`
    ${hud()}
    <h2>${S.day}일차 순찰 · 현재 시각 ${hh}:00 · 북서쪽 순찰실 앞</h2>
    ${ART_DOORS}
    ${S.notice?`<div class="card" style="padding:10px 14px;font-size:.9rem">${S.notice}</div>`:''}
    <div class="card narr">${d0.log.join('\n\n')}</div>
    ${choose?`<div class="card">
      <div class="sub" style="margin-bottom:10px">남은 판정 횟수: ${rem}</div>
      <div class="row">
        <button data-d="observe" ${rem<=0?'disabled':''}>관찰력 판정<br><small>시야 · 형체, 빛, 변화</small></button>
        <button data-d="hearing" ${rem<=0?'disabled':''}>듣기 판정<br><small>청각 · 소리, 기척</small></button>
        <button data-d="instinct" ${rem<=0?'disabled':''}>직감 판정<br><small>설명 못 할 느낌 · 오한, 기운</small></button>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="doorR">오른쪽 문을 열기</button>
        <button id="doorL">왼쪽 문을 열기</button>
      </div>
    </div>`:`<button id="doorDone">순찰실로 들어간다</button>`}
  `));
  if(choose){
    app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>doDoorCheck(b.dataset.d));
    $('doorR').onclick=()=>openDoor('right');
    $('doorL').onclick=()=>openDoor('left');
  } else {
    $('doorDone').onclick=()=>{ S._doorDone=true; S.notice=''; finishPatrol(); };
  }
},

ne_room(){
  const n=S._ne, rem=maxChecks()-n.checks;
  const hh=String(S.hour+1).padStart(2,'0');
  app.appendChild(el(`
    ${hud()}
    <h2>${S.day}일차 순찰 · 현재 시각 ${hh}:00 · 북동쪽</h2>
    ${ART_NE}
    ${S.notice?`<div class="card" style="padding:10px 14px;font-size:.9rem">${S.notice}</div>`:''}
    <div class="card narr">${n.log.join('\n\n')}</div>
    <div class="card">
      <div class="sub" style="margin-bottom:10px">남은 판정 횟수: ${rem}</div>
      <div class="row">
        <button data-n="observe" ${rem<=0?'disabled':''}>관찰력 판정<br><small>시야 · 형체, 빛, 변화</small></button>
        <button data-n="hearing" ${rem<=0?'disabled':''}>듣기 판정<br><small>청각 · 소리, 기척</small></button>
        <button data-n="instinct" ${rem<=0?'disabled':''}>직감 판정<br><small>설명 못 할 느낌 · 오한, 기운</small></button>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="neLine">🔴 레드라인을 친다</button>
        <button id="nePass">그냥 지나간다</button>
      </div>
    </div>
  `));
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>doNeCheck(b.dataset.n));
  $('neLine').onclick=()=>{
    if(!n.redTried){ n.redTried=true; n.log.push('<span class="bad">붉은 선 도구를 문 앞에 대어 보지만, 어째서인지 선이 그어지지 않는다. 이곳에는 레드라인을 칠 수 없다.</span>'); }
    render();
  };
  $('nePass').onclick=()=>{ S._neDone=true; S.notice=''; S.screen='patrol'; render(); };
},

gameover(){
  app.appendChild(el(`
    <h2 style="color:var(--red)">GAME OVER</h2>
    <div class="card narr">${S._overText||('시야가 흐려진다. 다리에 힘이 풀린다.\n'+S.name+'은 그 자리에 쓰러졌다. 아무도 그를 발견하지 못했다.')}</div>
    ${ART_MADNESS}
    <h2 style="color:var(--red);margin-top:24px">엔딩1. 광인</h2>
    <div class="card narr">제정신인 사람들은 모르는게 너무 많다.</div>
  `));
  app.appendChild(endGameNav());
},
};

function restoreSnapshot(){ applySnap(S._daySnapshot); }

function genHouses(minA, maxA, dc){
  const count=6;
  const anomN=Math.min(count, rand(minA,maxA));
  const idx=shuffle([...Array(count).keys()]).slice(0,anomN);
  const pool=shuffle(FLAVOR_BANK);
  return Array.from({length:count},(_,i)=>{
    const isAnomaly=idx.includes(i);
    const flavor=pool[i%pool.length];
    return {isAnomaly, dc, flavor, checked:[], log:[flavor.text], resolved:false};
  });
}

function startPatrol(day, minA, maxA, dc, existingHouses){
  S._retryArgs=[day,minA,maxA,dc];
  S._daySnapshot=takeSnap();
  const prevH=S._history[day];
  S._history[day]={
    snapshot: prevH ? prevH.snapshot : S._daySnapshot,
    retryArgs:[day,minA,maxA,dc],
    extra: prevH ? prevH.extra : {knowsResignation:S.knowsResignation, resignationSubmitted:S.resignationSubmitted, resignationCorrect:S.resignationCorrect}
  };
  S.houses=existingHouses||genHouses(minA,maxA,dc);
  S.day=day; S.hIndex=0; S.hour=0; S.checksThisHouse=0; S.usedStats=[]; S.notice=''; S._neDone=false; S._goneDone=false; S._doorDone=false; S._blackDone=false; S._backyardDone=false; S._overText='';
  S._earnedCoins=0; S._mindLoss=S._mindLoss||0;
  saveGame();
  S.screen='patrol'; render();
}

function doCheck(stat){
  const h=S.houses[S.hIndex];
  if(S.checksThisHouse>=maxChecks()) return;
  S.checksThisHouse++;
  const roll=rand(1,20);
  const total=roll+LV(stat);
  const success=total>=h.dc;
  const repeat=S.usedStats.includes(stat);
  S.usedStats.push(stat);
  let line=`[${CHECK_LABEL[stat]} 판정] 주사위 <span class="roll">${roll}</span> + Lv.${LV(stat)} = ${total} / DC ${h.dc} → `;
  line+= success?'<span class="ok">판정 성공</span>':'<span class="bad">별다른 변화 없음</span>';
  h.log.push(line);
  if(success){
    if(stat===h.flavor.t){
      if(h.isAnomaly) h.log.push(repeat ? h.flavor.anomDeep : h.flavor.anomOk);
      else h.log.push(h.flavor.normalOk);
    } else {
      h.log.push(MISS_TEXT[stat]);
    }
    if(stat==='observe' && S.day===11 && S.hIndex===3 && S.note11 && !S._backyardDone && !h.backyard){
      h.backyard=true;
      h.log.push('집 옆으로 뒷마당에 이어지는 좁은 길이 눈에 들어온다.');
    }
  }
  render();
}

function resolveHouse(placedLine){
  const h=S.houses[S.hIndex];
  const correct=(placedLine===h.isAnomaly);
  if(correct && placedLine){
    let gain=1, extra='';
    if(hasItem('bead') && Math.random()<0.15){ gain=2; extra=' 구슬이 은은하게 빛난다 — 주화가 두 배로 늘었다.'; }
    S.coins+=gain; S._earnedCoins+=gain;
    S.notice='<span class="ok">정확했다. 붉은 선이 문 앞에 그어진다. 주화를 '+(gain===2?'두 개':'하나')+' 얻었다.'+extra+'</span>';
  } else if(!correct){
    const k=useKkokdu();
    if(k){
      S.notice='<span class="ok">판단이 틀렸다. '+k+' (정신력 피해 없음)</span>';
    } else {
      S._mindLoss=(S._mindLoss||0)+1;
      S.notice='<span class="bad">판단이 틀렸다. 등 뒤로 서늘한 기운이 스친다. (정신력 -1)</span>';
    }
  } else {
    S.notice='';
  }
  S.hour++;
  nextHouse();
}

function doNeCheck(stat){
  const n=S._ne;
  if(n.checks>=maxChecks()) return;
  n.checks++;
  const dc=DAY_CFG[S.day].dc;
  const roll=rand(1,20), total=roll+LV(stat), success=total>=dc;
  let line=`[${CHECK_LABEL[stat]} 판정] 주사위 <span class="roll">${roll}</span> + Lv.${LV(stat)} = ${total} / DC ${dc} → `;
  line+= success?'<span class="ok">판정 성공</span>':'<span class="bad">별다른 변화 없음</span>';
  n.log.push(line);
  if(success) n.log.push(`<span class="redtxt">${NE_TEXT[stat]}</span>`);
  if(success && stat==='instinct' && !n.shocked){
    n.shocked=true; S._mindLoss=(S._mindLoss||0)+1;
    n.log.push('<span class="bad">충격으로 정신이 흔들린다. (정신력 -1)</span>');
    if(LV('mind')-(S._mindLoss||0)<=0){ S.screen='gameover'; render(); return; }
  }
  render();
}

const DOOR_INTRO='오늘도 열심히 일을 끝냈다. 마지막 순찰을 돈 뒤 북서쪽 순찰실로 돌아가는 길이였다.\n\n당신의 눈이 잘못된 것인지, 순찰실 문이 두개로 보인다.';
const DOOR_TEXT={
  observe:'오른쪽의 문에는 희미하게 레드라인이 그려져 있다.',
  hearing:'오른쪽 문을 누가 긁고 있는 것 같다.',
  instinct:'<span class="redtxt" style="font-style:italic">"난 오른쪽에 있어"</span>',
};
function finishPatrol(){
  if(S.cleanUsed && S.cleanCorrect && S._cleanDay===S.day){ S.screen='true2'; render(); return; }
  if(S.day===6 && S.resignationSubmitted && S.resignationCorrect){ S._resignEndStep=0; S.screen='resign_ending'; render(); return; }
  if(S.day===7 && !S._noteDone){ S._noteStep=0; S.screen='note_event'; render(); return; }
  if(S.day===13){ S._e5Phase=0; S.screen=S.kimGone?'true1':'ending5'; render(); return; }
  S.screen = S.day<13 ? 'day_summary' : 'ending'; render();
}
function doDoorCheck(stat){
  const d0=S._door;
  if(d0.checks>=maxChecks()) return;
  d0.checks++;
  const dc=DAY_CFG[S.day].dc;
  const roll=rand(1,20), total=roll+LV(stat), success=total>=dc;
  let line=`[${CHECK_LABEL[stat]} 판정] 주사위 <span class="roll">${roll}</span> + Lv.${LV(stat)} = ${total} / DC ${dc} → `;
  line+= success?'<span class="ok">판정 성공</span>':'<span class="bad">별다른 변화 없음</span>';
  d0.log.push(line);
  if(success) d0.log.push(DOOR_TEXT[stat]);
  render();
}
function openDoor(side){
  const d0=S._door;
  if(side==='left'){
    d0.log.push('문고리를 잡고 돌리자 당신에게 익숙한 순찰실의 풍경이 보인다. 여기서는 안전하다.');
    d0.phase='done'; render(); return;
  }
  const hit='문고리를 잡고 돌리자 무언가 당신을 덮친다. 그게 사람이였는지 어둠이였는지는 알 수 없다.';
  const k=useKkokdu();
  if(k){
    d0.log.push(hit,'<span class="ok">'+k+'</span>','다시 정신을 차려보니 당신은 순찰실 바닥에 누워 있었다. 많이 피곤했던 것일까?');
    d0.phase='done'; render();
  } else {
    S._overText=hit+'\n\n생각이 더 이뤄지기 전에 당신의 정신이 끊어진다.\n\n<span class="bad">(정신력 최대치가 하락한다)</span>\n\n[게임 오버]';
    S.screen='gameover'; render();
  }
}

function nextHouse(){
  const mind=LV('mind')-(S._mindLoss||0);
  if(mind<=0){ S.screen='gameover'; render(); return; }
  S.hIndex++; S.checksThisHouse=0; S.usedStats=[];
  if(S.hIndex>=S.houses.length){
    if(S.day===5 && !S._doorDone){
      S._door={checks:0,log:[DOOR_INTRO],phase:'choose'};
      S.notice=''; S.screen='door_event'; render(); return;
    }
    finishPatrol(); return;
  }
  if(S.day===4 && S.hIndex===3 && !S._neDone){
    S._ne={checks:0,log:[NE_INTRO],redTried:false};
    S.notice=''; S.screen='ne_room'; render(); return;
  }
  if(S.day===10 && S.hIndex===4 && !S._blackDone){
    S.notice=''; S._blackPhase=0; S.screen='black_event'; render(); return;
  }
  if(S.day===5 && S.hIndex===3 && !S._goneDone){
    S.notice=''; S.screen='ne_gone'; render(); return;
  }
  S.screen='patrol'; render();
}

render();
</script>
