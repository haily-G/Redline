<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>레드라인</title>
<style>
:root{
  --bg:#0b0b0d; --panel:#141416; --border:#3a1414; --red:#b3231c;
  --red-dim:#5c1a17; --text:#d9d4c6; --dim:#8a8478; --coin:#c9a24a;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){:root{--bg:#0b0b0d;}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Nanum Myeongjo","Batang",Georgia,serif;
  line-height:1.7;
}
#app{max-width:920px;margin:0 auto;padding:24px 22px 52px;min-height:100vh}
h1{font-size:1.6rem;letter-spacing:2px;color:var(--red);margin:0 0 4px;font-weight:700}
h2{font-size:1.05rem;color:#e8e2d2;border-bottom:1px solid var(--border);padding-bottom:8px;margin:0 0 16px}
.sub{color:var(--dim);font-size:.85rem;margin-bottom:24px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:2px;padding:20px;margin-bottom:16px}
.narr{white-space:pre-line;font-size:1rem;margin-bottom:18px}
.glitch{color:var(--red);font-family:monospace;letter-spacing:1px;text-shadow:0 0 6px rgba(179,35,28,.7);word-break:break-all;font-size:.8rem;opacity:.85}
.rulewrap{font-size:.92rem;color:#c7c1b3}
.rulewrap li{margin-bottom:10px}
button{
  display:block;width:100%;text-align:left;background:#1b1b1e;color:var(--text);
  border:1px solid var(--border);padding:12px 14px;margin-bottom:10px;border-radius:2px;
  font-family:inherit;font-size:.95rem;cursor:pointer;transition:border-color .15s,background .15s;
}
button:hover{border-color:var(--red);background:#201414}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--red)}
.row{display:flex;gap:10px}
.row button{flex:1}
.statbar{display:flex;justify-content:space-between;font-family:monospace;font-size:.82rem;color:var(--dim);margin-bottom:6px}
.statgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}
.statgrid input{width:56px;background:#1b1b1e;color:var(--text);border:1px solid var(--border);text-align:center;padding:6px;font-family:monospace}
.hud{display:flex;justify-content:space-between;font-family:monospace;font-size:.78rem;color:var(--dim);border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:20px;flex-wrap:wrap;gap:6px}
.hud b{color:var(--text)}
.coin{color:var(--coin)}
.tag{display:inline-block;font-size:.72rem;color:var(--dim);border:1px solid var(--border);padding:1px 6px;border-radius:2px;margin-right:6px}
.roll{font-family:monospace;color:var(--red);font-weight:bold}
.row .slot{flex:1}
.redtxt{color:var(--red);font-weight:bold;text-shadow:0 0 6px rgba(179,35,28,.6)}
.art{margin-bottom:14px;border:1px solid var(--border);border-radius:2px;overflow:hidden;background:#000;line-height:0}
.art svg,.art canvas,.art img{display:block;width:100%;height:auto;image-rendering:pixelated;shape-rendering:crispEdges}
button small{color:var(--dim);font-size:.72rem}
.slot{border:1px dashed var(--border);padding:8px 10px;font-size:.82rem;color:var(--dim);border-radius:2px;line-height:1.5}
.slot.filled{border-style:solid;color:var(--text)}
.slot.filled span{color:var(--dim);font-size:.75rem}
.ok{color:#7fae7f}.bad{color:var(--red)}

/* 도트 일러스트만 추가하고 원래 UI 배치는 유지 */
.scene-visual{position:relative;margin:0 0 16px;overflow:hidden;border:1px solid #49302a;background:#000;line-height:0;box-shadow:0 12px 32px #0007}
.scene-visual canvas,.scene-visual img,.pixel-art canvas,.pixel-art img{display:block;width:100%;height:auto;image-rendering:pixelated}
.scene-visual figcaption{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:10px;padding:8px 12px;background:linear-gradient(90deg,#0b0b0de8,#0b0b0db0);color:#aaa092;font:11px monospace;letter-spacing:.04em}
.scene-visual figcaption strong{color:#e3d8c6;font:inherit}
.narr{font-size:1.02rem;line-height:1.9;padding:22px 24px;background:#131316;border-color:#4a2825}
button{min-height:44px;transition:background .15s,border-color .15s,transform .15s}
button:hover{transform:translateY(-1px)}
@media(max-width:640px){#app{padding:16px 12px 44px}.hud{font-size:.7rem}.scene-visual{margin-bottom:12px}.scene-visual figcaption{padding:6px 8px;font-size:9px}.narr{padding:18px;font-size:.98rem}.row{flex-wrap:wrap}.row button{min-width:calc(50% - 5px)}}
</style>
</head>

const pick=arr=>arr[rand(0,arr.length-1)];
const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};

const LV=k=>Math.floor((S.stats[k]+S.bonus[k])/2)+(k==='mind'?(S.mindMax||0):0);
function maxChecks(){ return 3+(S.items&&S.items.some(i=>i.id==='inju')?1:0); }
const josa=(n,a,b)=>{const c=(n||'').charCodeAt((n||'').length-1);return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0)?a:b;};
function totalMind(){return Math.max(0, LV('mind') - (S._mindLoss||0));}

  }));

function applySnap(snap){
  if(!snap) return;
  S.stats=JSON.parse(JSON.stringify(snap.stats));
  S.bonus=JSON.parse(JSON.stringify(snap.bonus));
  S.items=JSON.parse(JSON.stringify(snap.items));
  S.coins=snap.coins; S.slots=snap.slots;
  S.candyCharges=snap.candyCharges; S.talisman=snap.talisman;
  S._mindLoss=snap._mindLoss;
  S.mindMax=snap.mindMax||0; S.mirror=!!snap.mirror; S.note11=!!snap.note11; S.kimGone=!!snap.kimGone; S.safeLetter=!!snap.safeLetter; S.cleanUsed=!!snap.cleanUsed; S.cleanCorrect=!!snap.cleanCorrect; S._cleanDay=snap.cleanDay||0;
}
function beginDay(day, snapshot, extra){
  if(snapshot) applySnap(snapshot);
  if(extra){
    S.knowsResignation=extra.knowsResignation;
    S.resignationSubmitted=extra.resignationSubmitted;
    S.resignationCorrect=extra.resignationCorrect;
    S.d9Worked=extra.d9Worked;
  }
  S.day=day;
  S.fortuneHint=''; S.restNotice=''; S._kimStep=0; S._kim7Phase=0; S._kim10Phase=0; S._k8=null; S._predStep=undefined; S._resignEndStep=0;
  S._pendingHouses=null; S._shopDay=undefined; S._noteDone=false; S._d9Phase=0; S._h9=null;
  Object.keys(S._history).forEach(k=>{ if(+k>day) delete S._history[k]; });
  if(day===1){ S._drawerPool=shuffle(DRAWER_ITEMS).slice(0,2); S._equipNext='day1_intro'; S.screen='equip1'; }
  else if(day===6){ S._predStep=0; S.screen='predecessor_event'; }
  else if(day===9){ S.screen='day9_start'; }
  else if(day===10){ startDay10(); return; }
  else { S.screen='day_rules'; }
  render();
}
function jumpToDay(day){
  const h=S._history[day];
  if(!h) return;
  beginDay(day, h.snapshot, h.extra);
}

function sceneKey(){
  const s=S.screen;
  if(['gameover','ending3','true1','true2','ending5','ending','next_wait'].includes(s)) return '';
  if(s==='kim_intro') return S.kimGone||S.day===4?'alley':(S.day===8?'shadow':'merchant');
  if(s==='shop') return 'merchant';
  if(s==='black_event') return 'shadow';
  if(s==='backyard_event') return 'yard';
  if(['door_event','ne_room','ne_gone'].includes(s)) return 'impossible';
  if(s==='day9_hold') return 'station';
  if(['day_rules','equip1','day1_intro','cabinet','cabinet_open','predecessor_event','day9_room','day9_go','day10_gift','resign_name','resign_done','env_open','env_name','env_done'].includes(s)) return 'station';
  if(['day_intro','day_summary','day9_start','day9_end','patrol'].includes(s)) return 'alley';
  return '';
}

  const key=sceneKey();

  const labels={alley:'남동쪽 골목',merchant:S.day>=10?'김솔의 만물상':'알 수 없는 만물상',shadow:'가로등 아래',impossible:'북동쪽 순찰실',yard:'집 뒤편',station:'남동쪽 순찰실'};

}

}

}

  try{

    Object.assign(S,data);

  }catch(e){ return false; }

    ${hud()}
    <div class="card narr">정비를 마치고 나서려는데, 순찰실 구석의 낡은 캐비닛이 눈에 들어온다.</div>
    <button id="cabOpen">캐비닛을 열어본다</button>
    <button id="cabSkip">열지 않는다</button>
  `));
  $('cabOpen').onclick=()=>{ S.screen='cabinet_open'; render(); };
  $('cabSkip').onclick=()=>{ S.screen='kim_intro'; render(); };
},

cabinet_open(){
  app.appendChild(el(`
    ${hud()}
    <div class="card narr">오래되어 변색된 종이 봉투가 나온다. 입구는 단단히 밀봉되어 있고, 겉면에는 「사직서」라고 적혀 있다.</div>
    <button id="resignUse">사용한다</button>
    <button id="resignSkip">사용하지 않는다</button>
  `));
  $('resignUse').onclick=()=>{ S.screen='resign_name'; render(); };
  $('resignSkip').onclick=()=>{ S.screen='kim_intro'; render(); };
},

resign_name(){
  app.appendChild(el(`
    ${hud()}
    <div class="card narr">봉투를 뜯으니 안쪽에 빈칸이 하나 있다. 이름을 적으라는 듯하다.</div>
    <div class="card">
      <input id="resignInput" placeholder="이름" style="width:100%;padding:10px;background:#1b1b1e;border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:1rem">
    </div>
    <button id="resignSubmit">적은 이름으로 봉투를 닫는다</button>
  `));
  $('resignSubmit').onclick=()=>{
    const v=$('resignInput').value.trim();
    if(!v){ $('resignInput').style.borderColor='var(--red)'; return; }
    S.resignationSubmitted=true;
    S.resignationCorrect=(v===S.name);
    S.screen='resign_done'; render();
  };
},

resign_done(){
  app.appendChild(el(`
    ${hud()}
    <div class="card narr">봉투를 단단히 봉하고, 정비를 마친 뒤 우체통에 사직서를 넣는다.
서늘한 밤바람이 손끝을 스친다.</div>
    <button id="afterResign">만물상으로 향한다</button>
  `));
  $('afterResign').onclick=()=>{ S.screen='kim_intro'; render(); };
},

env_open(){

    ${hud()}

안에는 얼룩 하나 없는 깨끗한 사직서가 들어 있다.</div>

env_name(){
  app.appendChild(el(`
    ${hud()}
    <div class="card narr">깨끗한 사직서에는 빈칸이 하나 있다. 이름을 적으라는 듯하다.</div>

'귀하의 성실한 근무 태도를 본사는 높게 평가하였으나 내부 사정으로 인해 해당 직무를 더 이상 유지하지 못하게 되었음을 알려드립니다.'

true2(){
  app.appendChild(el(`
    ${hud()}
    ${pixelArtwork('dawn','골목 너머로 밝아오는 새벽')}
    <h2 style="color:var(--red);margin-top:24px">트루엔딩2. [일상으로]</h2>
    <div class="card narr">사직서가 수료 된 다음날.

회사에서는 근무 시간을 책정해 계좌로 돈을 입금해주었다.

그 모든 ${S._cleanDay}일 간의 일들이 전부 꿈만 같이 느껴진다.

당분간은 문 앞의 붉은 선들을 보지 않아도 되겠지.</div>
  `));
  app.appendChild(endGameNav());
},

handover(){
  app.appendChild(el(`
    <div class="card narr">"고생 많을 거야. 근데 별거 없어. 보이면 긋고, 안 보이면 그냥 지나가면 돼."

그는 낡은 순찰복과 붉은 선을 그을 도구를 건네고는, 뒤도 안 돌아보고 골목 저편으로 사라졌다.
당신은 그의 뒷모습이 완전히 사라질 때까지 그 자리에 서 있었다.
${escapeHtml(S.name)}, 이제 당신 차례다.</div>
    <button id="goBtn">장비보관소로 간다</button>
  `));
  $('goBtn').onclick=()=>{
    S._drawerPool=shuffle(DRAWER_ITEMS).slice(0,2);
    S._equipNext='day1_intro';
    S._maintPool=S._drawerPool; S._maintSnapshot=takeSnap();
    S._history[1]={snapshot:S._maintSnapshot, retryArgs:[1,2,3,12], extra:{}};
    S.screen='equip1'; render();
  };
},

equip1(){
  const full=S.items.length>=S.slots;
  app.appendChild(el(`
    ${hud()}
    <h2>장비보관소 — 서랍 2개, 도구는 하나</h2>
    <div class="sub">둘 중 하나만 챙길 수 있습니다.${full?` 장비 슬롯이 가득 차 있어, 새 장비를 고르면 <b>${S.items[0].name}</b>을(를) 내려놓게 됩니다.`:''}</div>
    <div class="card" id="drawers"></div>
  `));
  const d=$('drawers');
  S._drawerPool.forEach(it=>{
    const b=document.createElement('button');
    b.innerHTML=`<b>${it.name}</b>${statPreview(it)}<span style="font-size:.85rem;color:var(--dim)">${it.desc}</span>`;
    b.onclick=()=>{
      if(full) removeItem(S.items[0]);
      addItem(it);
      S.screen=S._equipNext||'day1_intro'; render();
    };
    d.appendChild(b);
  });
  if(full){
    const k=document.createElement('button');
    k.textContent='아무것도 가져가지 않는다 (현재 장비 유지)';
    k.onclick=()=>{S.screen=S._equipNext||'day1_intro'; render();};
    d.appendChild(k);
  }
},

day1_intro(){
  app.appendChild(el(`
    ${hud()}
    <h2>1일차 · 자정</h2>
    <div class="card narr">시계가 자정을 넘긴다. 정비 시간이 끝났다.
남동쪽 순찰실 문틈으로 당신은 골목을 바라본다. 오늘 밤, 이 길을 따라 북서쪽까지 걸어야 한다.
손에 쥔 붉은 선 도구가 유난히 무겁게 느껴진다.</div>
    <button id="startBtn">순찰을 시작한다</button>
  `));
  $('startBtn').onclick=()=>{startPatrol(1,2,3,12);};
},

patrol(){
  const h=S.houses[S.hIndex];
  const remainingChecks=maxChecks()-S.checksThisHouse;
  const hh=String(S.hour+1).padStart(2,'0');
  app.appendChild(el(`
    ${hud()}
    <h2>${S.day}일차 순찰 · 현재 시각 ${hh}:00 · ${S.hIndex+1}/${S.houses.length}번째 집</h2>
    ${S.notice?`<div class="card" style="padding:10px 14px;font-size:.9rem">${S.notice}</div>`:''}
    <div class="card narr">${h.log.join('\n\n')}</div>
    <div class="card">
      <div class="sub" style="margin-bottom:10px">이 집에서 남은 판정 횟수: ${remainingChecks}</div>
      <div class="row">
        ${h.backyard?'<button id="backyardBtn">집의 뒷마당을 살펴본다<br><small>시야 · 집 뒤편으로 이어지는 길</small></button>':`<button data-c="observe" ${remainingChecks<=0?'disabled':''}>관찰력 판정<br><small>시야 · 형체, 빛, 변화</small></button>`}
        <button data-c="hearing" ${remainingChecks<=0?'disabled':''}>듣기 판정<br><small>청각 · 소리, 기척</small></button>
        <button data-c="instinct" ${remainingChecks<=0?'disabled':''}>직감 판정<br><small>설명 못 할 느낌 · 오한, 기운</small></button>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="lineBtn">🔴 레드라인을 친다</button>
        <button id="passBtn">그냥 지나간다</button>
      </div>
      ${S.candyCharges>0?'<button id="candyBtn">사탕을 먹는다 (정신력 +1, 1회용)</button>':''}
    </div>
  `));
  app.querySelectorAll('[data-c]').forEach(b=>{
    b.onclick=()=>doCheck(b.dataset.c);
  });
  if(h.backyard) $('backyardBtn').onclick=()=>{ S._bkPhase=0; S.screen='backyard_event'; render(); };
  $('lineBtn').onclick=()=>resolveHouse(true);
  $('passBtn').onclick=()=>resolveHouse(false);
  if(S.candyCharges>0) $('candyBtn').onclick=()=>{
    S.candyCharges=0; S._mindLoss=Math.max(0,(S._mindLoss||0)-1);
    S.items=S.items.filter(it=>it.consumable!=='candy');
    render();
  };
},

day_summary(){
  const mind=LV('mind')-(S._mindLoss||0);
  app.appendChild(el(`
    ${hud()}
    <h2>${S.day}일차 종료</h2>
    ${S.notice?`<div class="card" style="padding:10px 14px;font-size:.9rem">${S.notice}</div>`:''}
    <div class="card narr">07:00. 북서쪽 순찰실 문을 닫는다. 창밖이 서서히 밝아온다.
이번 순찰에서 붉은 주화 ${S._earnedCoins||0}개를 얻었다. 정신력은 ${mind}로 남았다.
${mind<=3?'\n손이 아직도 떨린다.':''}</div>
    <button id="nextBtn">${S.day+1}일차로</button>
  `));
  $('nextBtn').onclick=()=>{
    S._mindLoss=Math.max(0,(S._mindLoss||0)-1);
    S.restNotice='하루 몸을 뉘인 덕분인지, 정신이 한결 안정을 되찾은 것 같다. (정신력 +1)';
    S.day++;
    S._maintSnapshot=takeSnap();
    const dc0=DAY_CFG[S.day]||{a:0,b:0,dc:0};
    S._history[S.day]={snapshot:S._maintSnapshot, retryArgs:[S.day,dc0.a,dc0.b,dc0.dc],
      extra:{knowsResignation:S.knowsResignation, resignationSubmitted:S.resignationSubmitted, resignationCorrect:S.resignationCorrect}};
    if(S.day===6){ S._predStep=0; S.screen='predecessor_event'; }
    else if(S.day===9){ S._d9Phase=0; saveGame(); S.screen='day9_start'; }
    else { S.screen='day_rules'; }
    render();
  };
},

day_rules(){
  const r=DAY_RULES[S.day];
  const openLine=(S.day===7 && S.knowsResignation)?'퇴사의 유혹을 뿌리치고 출근하는 일곱째 날이다.\n\n':'';
  const body = r.dense
    ? `<span style="font-size:.85rem;line-height:1.5">${Array(36).fill(r.dense).join(' ')}</span>`
    : r.plain
      ? r.plain
      : `「오늘의 추가 수칙」
${r.rules.map(x=>'・ '+x).join('\n')}${r.noRange?'':`
・ 오늘 예상 이상현상 발생 구간: ${DAY_CFG[S.day].a} ~ ${DAY_CFG[S.day].b}건.`}`;
  app.appendChild(el(`
    ${hud()}
    <h2>${S.day}일차 · 추가 수칙서</h2>
    ${S.restNotice?`<div class="card" style="padding:10px 14px;font-size:.9rem">${S.restNotice}</div>`:''}
    <div class="card narr">${openLine}${r.intro}

${body}</div>
    <button id="freeBtn">장비보관소로 간다</button>
  `));
  S.restNotice='';
  $('freeBtn').onclick=()=>{
    S._drawerPool=shuffle(DRAWER_ITEMS.filter(x=>!S.items.some(i=>i.id===x.id))).slice(0,2);
    S._equipNext=(S.day===6 && S.knowsResignation) ? 'cabinet' : 'kim_intro';
    S._kimStep=0; S._kim7Phase=0; S._kim10Phase=0; S._k8=null; S._maintPool=S._drawerPool;
    S.screen='equip1'; render();
  };
},

kim_intro(){
  S.slots=2;
  if(S.kimGone){
    app.appendChild(el(`
      ${hud()}
      <div class="card narr">오늘은 그 남자가 보이지 않는다.</div>
      <button id="goneKimBtn">정비를 마친다</button>
    `));
    $('goneKimBtn').onclick=()=>{S.screen='day_intro';render();};
    return;
  }
  if(S.day===8){ kim8Event(); return; }
  if(S.day===4){
    app.appendChild(el(`
      ${hud()}
      <div class="card narr">오늘은 그 남자가 보이지 않는다.</div>
      <button id="noKimBtn">정비를 마친다</button>
    `));
    $('noKimBtn').onclick=()=>{S.screen='day_intro';render();};
    return;
  }
  if(S.day===6){ kimScene(KIM6); return; }
  if(S.day===5){ kimScene(KIM5); return; }
  if(S.day===7){ kim7Scene(); return; }
  if(S.day===10){ kim10Scene(); return; }
  if(S.day===11){ kim11Scene(); return; }
  if(S.day===13){ kim13Scene(); return; }
  if(S.day>7){
    app.appendChild(el(`
      ${hud()}
      <div class="card narr">그 사람은 오늘도 같은 자리에서 진열대를 펼쳐놓고 있다.</div>
      <button id="shopBtn7">만물상을 살펴본다</button>
    `));
    $('shopBtn7').onclick=goShop;
    return;
  }
  if(S.day>=3){ kimScene(KIM3); return; }
  app.appendChild(el(`
    ${hud()}
    <div class="card narr">골목 어귀에 낯선 그림자가 서 있다. 검은 머리, 노란 눈, 훤칠한 장신.
검은 한복 위에 겉은 검고 속은 붉은 도포를 걸친 남성이였다. 서른 중반쯤으로 보이지만 확신할 수 없다.

"오, 그래서, 그 놈들이 새 순찰자를 기어코 뽑았군?"

"보아하니 붉은 주화를 좀 얻은 듯한데, 물건 좀 사지 않을래?"

"음, 그 놈들이 주는 장비가 이미 있다고? 손은 두 개니 장비도 두 개 쓰면 되는 거 아닌가."

"자자, 그럼 골라봐. 이 중 하나만 고르면 후딱 팔아주지."</div>
    <div class="card" style="padding:10px 14px;font-size:.9rem">장비 슬롯이 2개로 늘어났다.</div>
    <button id="shopBtn">만물상을 살펴본다</button>
  `));
  $('shopBtn').onclick=goShop;
},

shop(){
  const full=S.items.length>=S.slots;
  app.appendChild(el(`
    ${hud()}
    <h2>${S.day>=10?'김솔의 ':''}만물상</h2>
    ${S._kimSmile?'<div class="card narr">그가 의미심장한 미소를 지었다.</div>':''}
    <div class="sub">보유 주화: <span class="coin">${S.coins}</span> · 오늘은 하나만 살 수 있다.${full?` 장비 슬롯이 가득 차 있어, 장비를 사면 <b>${S.items[0].name}</b>을(를) 내려놓게 된다. (뽑기는 슬롯을 쓰지 않는다)`:''}</div>
    <div class="card" id="shopCard"></div>
    <button id="skipBtn">사지 않고 나선다</button>
  `));
  const c=$('shopCard');
  S._shopPool.forEach(it=>{
    const b=document.createElement('button');
    const price=shopPrice(it);
    const afford=S.coins>=price;
    b.disabled=!afford;
    b.innerHTML=`<b>${it.name}</b> <span class="coin">${price<it.cost?'<s style="color:var(--dim)">'+it.cost+'</s> ':''}${price}주화</span>${statPreview(it)}<span style="font-size:.85rem;color:var(--dim)">${it.desc}</span>`;
    b.onclick=()=>{
      S.coins-=price;
      if(it.consumable==='fortune'){
        if(S._fortuneDay!==S.day){
          const anomIdx=S._pendingHouses.map((h,i)=>h.isAnomaly?i+1:null).filter(v=>v!==null);
          S._fortuneN=pick(anomIdx); S._fortuneDay=S.day;
        }
        const n=S._fortuneN;
        S.fortuneHint=`뽑기를 펼치니 이런 문구가 적혀 있다 — "오늘 밤, ${n}번째로 마주칠 집을 각별히 조심하라."`;
      } else {
        if(S.items.length>=S.slots) removeItem(S.items[0]);
        addItem(it);
      }
      S._kimSmile=false; S.screen='day_intro'; render();
    };
    c.appendChild(b);
  });
  $('skipBtn').onclick=()=>{S._kimSmile=false; S.screen='day_intro';render();};
},

day_intro(){

    ${pixelArtwork('madness','비 내리는 골목에 쓰러진 순찰자')}
    <h2 style="color:var(--red);margin-top:24px">엔딩1. 광인</h2>
    <div class="card narr">제정신인 사람들은 모르는게 너무 많다.</div>
  `));
  app.appendChild(endGameNav());
},
};

function restoreSnapshot(){ applySnap(S._daySnapshot); }

function genHouses(minA, maxA, dc){
  const count=6;
  const anomN=Math.min(count, rand(minA,maxA));
  const idx=shuffle([...Array(count).keys()]).slice(0,anomN);
  const pool=shuffle(FLAVOR_BANK);
  return Array.from({length:count},(_,i)=>{
    const isAnomaly=idx.includes(i);
    const flavor=pool[i%pool.length];
    return {isAnomaly, dc, flavor, checked:[], log:[flavor.text], resolved:false};
  });
}

function startPatrol(day, minA, maxA, dc, existingHouses){
  S._retryArgs=[day,minA,maxA,dc];
  S._daySnapshot=takeSnap();
  const prevH=S._history[day];
  S._history[day]={
    snapshot: prevH ? prevH.snapshot : S._daySnapshot,
    retryArgs:[day,minA,maxA,dc],
    extra: prevH ? prevH.extra : {knowsResignation:S.knowsResignation, resignationSubmitted:S.resignationSubmitted, resignationCorrect:S.resignationCorrect}
  };
  S.houses=existingHouses||genHouses(minA,maxA,dc);
  S.day=day; S.hIndex=0; S.hour=0; S.checksThisHouse=0; S.usedStats=[]; S.notice=''; S._neDone=false; S._goneDone=false; S._doorDone=false; S._blackDone=false; S._backyardDone=false; S._overText='';
  S._earnedCoins=0; S._mindLoss=S._mindLoss||0;
  saveGame();
  S.screen='patrol'; render();
}

function doCheck(stat){
  const h=S.houses[S.hIndex];
  if(S.checksThisHouse>=maxChecks()) return;
  S.checksThisHouse++;
  const roll=rand(1,20);
  const total=roll+LV(stat);
  const success=total>=h.dc;
  const repeat=S.usedStats.includes(stat);
  S.usedStats.push(stat);
  let line=`[${CHECK_LABEL[stat]} 판정] 주사위 <span class="roll">${roll}</span> + Lv.${LV(stat)} = ${total} / DC ${h.dc} → `;
  line+= success?'<span class="ok">판정 성공</span>':'<span class="bad">별다른 변화 없음</span>';
  h.log.push(line);
  if(success){
    if(stat===h.flavor.t){
      if(h.isAnomaly) h.log.push(repeat ? h.flavor.anomDeep : h.flavor.anomOk);
      else h.log.push(h.flavor.normalOk);
    } else {
      h.log.push(MISS_TEXT[stat]);
    }
    if(stat==='observe' && S.day===11 && S.hIndex===3 && S.note11 && !S._backyardDone && !h.backyard){
      h.backyard=true;
      h.log.push('집 옆으로 뒷마당에 이어지는 좁은 길이 눈에 들어온다.');
    }
  }
  render();
}

function resolveHouse(placedLine){
  const h=S.houses[S.hIndex];
  const correct=(placedLine===h.isAnomaly);
  if(correct && placedLine){
    let gain=1, extra='';
    if(hasItem('bead') && Math.random()<0.15){ gain=2; extra=' 구슬이 은은하게 빛난다 — 주화가 두 배로 늘었다.'; }
    S.coins+=gain; S._earnedCoins+=gain;
    S.notice='<span class="ok">정확했다. 붉은 선이 문 앞에 그어진다. 주화를 '+(gain===2?'두 개':'하나')+' 얻었다.'+extra+'</span>';
  } else if(!correct){
    const k=useKkokdu();
    if(k){
      S.notice='<span class="ok">판단이 틀렸다. '+k+' (정신력 피해 없음)</span>';
    } else {
      S._mindLoss=(S._mindLoss||0)+1;
      S.notice='<span class="bad">판단이 틀렸다. 등 뒤로 서늘한 기운이 스친다. (정신력 -1)</span>';
    }
  } else {
    S.notice='';
  }
  S.hour++;
  nextHouse();
}

function doNeCheck(stat){
  const n=S._ne;
  if(n.checks>=maxChecks()) return;
  n.checks++;
  const dc=DAY_CFG[S.day].dc;
  const roll=rand(1,20), total=roll+LV(stat), success=total>=dc;
  let line=`[${CHECK_LABEL[stat]} 판정] 주사위 <span class="roll">${roll}</span> + Lv.${LV(stat)} = ${total} / DC ${dc} → `;
  line+= success?'<span class="ok">판정 성공</span>':'<span class="bad">별다른 변화 없음</span>';
  n.log.push(line);
  if(success) n.log.push(`<span class="redtxt">${NE_TEXT[stat]}</span>`);
  if(success && stat==='instinct' && !n.shocked){
    n.shocked=true; S._mindLoss=(S._mindLoss||0)+1;
    n.log.push('<span class="bad">충격으로 정신이 흔들린다. (정신력 -1)</span>');
    if(LV('mind')-(S._mindLoss||0)<=0){ S.screen='gameover'; render(); return; }
  }
  render();
}

const DOOR_INTRO='오늘도 열심히 일을 끝냈다. 마지막 순찰을 돈 뒤 북서쪽 순찰실로 돌아가는 길이였다.\n\n당신의 눈이 잘못된 것인지, 순찰실 문이 두개로 보인다.';
const DOOR_TEXT={
  observe:'오른쪽의 문에는 희미하게 레드라인이 그려져 있다.',
  hearing:'오른쪽 문을 누가 긁고 있는 것 같다.',
  instinct:'<span class="redtxt" style="font-style:italic">"난 오른쪽에 있어"</span>',
};
function finishPatrol(){
  if(S.cleanUsed && S.cleanCorrect && S._cleanDay===S.day){ S.screen='true2'; render(); return; }
  if(S.day===6 && S.resignationSubmitted && S.resignationCorrect){ S._resignEndStep=0; S.screen='resign_ending'; render(); return; }
  if(S.day===7 && !S._noteDone){ S._noteStep=0; S.screen='note_event'; render(); return; }
  if(S.day===13){ S._e5Phase=0; S.screen=S.kimGone?'true1':'ending5'; render(); return; }
  S.screen = S.day<13 ? 'day_summary' : 'ending'; render();
}
function doDoorCheck(stat){
  const d0=S._door;
  if(d0.checks>=maxChecks()) return;
  d0.checks++;
  const dc=DAY_CFG[S.day].dc;
  const roll=rand(1,20), total=roll+LV(stat), success=total>=dc;
  let line=`[${CHECK_LABEL[stat]} 판정] 주사위 <span class="roll">${roll}</span> + Lv.${LV(stat)} = ${total} / DC ${dc} → `;
  line+= success?'<span class="ok">판정 성공</span>':'<span class="bad">별다른 변화 없음</span>';
  d0.log.push(line);
  if(success) d0.log.push(DOOR_TEXT[stat]);
  render();
}
function openDoor(side){
  const d0=S._door;
  if(side==='left'){
    d0.log.push('문고리를 잡고 돌리자 당신에게 익숙한 순찰실의 풍경이 보인다. 여기서는 안전하다.');
    d0.phase='done'; render(); return;
  }
  const hit='문고리를 잡고 돌리자 무언가 당신을 덮친다. 그게 사람이였는지 어둠이였는지는 알 수 없다.';
  const k=useKkokdu();
  if(k){
    d0.log.push(hit,'<span class="ok">'+k+'</span>','다시 정신을 차려보니 당신은 순찰실 바닥에 누워 있었다. 많이 피곤했던 것일까?');
    d0.phase='done'; render();
  } else {
    S._overText=hit+'\n\n생각이 더 이뤄지기 전에 당신의 정신이 끊어진다.\n\n<span class="bad">(정신력 최대치가 하락한다)</span>\n\n[게임 오버]';
    S.screen='gameover'; render();
  }
}

function nextHouse(){
  const mind=LV('mind')-(S._mindLoss||0);
  if(mind<=0){ S.screen='gameover'; render(); return; }
  S.hIndex++; S.checksThisHouse=0; S.usedStats=[];
  if(S.hIndex>=S.houses.length){
    if(S.day===5 && !S._doorDone){
      S._door={checks:0,log:[DOOR_INTRO],phase:'choose'};
      S.notice=''; S.screen='door_event'; render(); return;
    }
    finishPatrol(); return;
  }
  if(S.day===4 && S.hIndex===3 && !S._neDone){
    S._ne={checks:0,log:[NE_INTRO],redTried:false};
    S.notice=''; S.screen='ne_room'; render(); return;
  }
  if(S.day===10 && S.hIndex===4 && !S._blackDone){
    S.notice=''; S._blackPhase=0; S.screen='black_event'; render(); return;
  }
  if(S.day===5 && S.hIndex===3 && !S._goneDone){
    S.notice=''; S.screen='ne_gone'; render(); return;
  }
  S.screen='patrol'; render();
}

render();
</script>
